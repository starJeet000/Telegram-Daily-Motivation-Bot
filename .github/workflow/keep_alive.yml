name: Render Ping & Keep-Alive Cron

on:
  schedule:
    # Runs every 14 minutes (POSIX cron syntax)
    - cron: "*/14 * * * *"
  # Allows manual triggering from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Express API Endpoint
        run: |
          echo "Pinging backend server to prevent Render spin-down..."
          curl -s -X GET "https://telegram-daily-motivation-bot.onrender.com/api/quotes/latest" > /dev/null
          echo "Ping successful!"
